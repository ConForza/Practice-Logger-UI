<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Practice Tracker favicon">
  <defs>
    <linearGradient id="bg" x1="12" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Metronome body -->
  <path d="M23 50h18L36.5 16h-9L23 50Z" fill="#f8fafc"/>
  <path d="M26 47h12L34.7 20h-5.4L26 47Z" fill="#dbeafe"/>

  <!-- Metronome arm -->
  <path d="M32 43L45 20" stroke="#facc15" stroke-width="4" stroke-linecap="round"/>
  <circle cx="45" cy="20" r="3.5" fill="#facc15"/>

  <!-- Quaver / eighth note -->
  <path d="M18 21v18" stroke="#f8fafc" stroke-width="4" stroke-linecap="round"/>
  <circle cx="15" cy="40" r="5" fill="#f8fafc"/>
  <path
    d="M18 21c5.5 0 10.5 2.2 13.5 6.2"
    stroke="#f8fafc"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Small progress tick -->
  <path d="M42 45l4 4 8-10" stroke="#22c55e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
